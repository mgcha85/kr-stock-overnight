[package]
name = "kr-stock-live"
version = "0.1.0"
edition = "2021"
description = "Rust 1:1 port of the kr_stock overnight paper-trading pipeline"
license = "MIT"

[lib]
name = "kr_stock_live"
path = "src/lib.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "parity_check"
path = "src/bin/parity_check.rs"

[[bin]]
name = "trader"
path = "src/bin/trader.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
polars = { version = "0.45", features = [
  "lazy",
  "parquet",
  "dtype-datetime",
  "dtype-date",
  "rolling_window",
  "strings",
  "abs",
  "pct_change",
  "diff",
  "rank",
  "is_in",
] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["ndarray", "download-binaries"] }
lightgbm3 = "1.0.10"

[dev-dependencies]
approx = "0.5"
