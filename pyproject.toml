[project]
name = "kr-stock-overnight"
version = "0.1.0"
description = "KRX Stock Market Overnight Strategy Research & Scoring Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "google-generativeai>=0.4.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "pyarrow>=14.0.0",
    "finance-datareader>=0.9.50",
    "websocket-client>=1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
